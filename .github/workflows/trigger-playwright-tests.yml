name: Trigger Playwright Tests

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  trigger-e2e:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch event to playwright-automation repository
        env:
          TOKEN: ${{ secrets.PLAYWRIGHT_TESTS_TRIGGER_E2E }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          SHA: ${{ github.sha }}
        run: |
          # jq builds safe JSON even if the PR title contains quotes
          PAYLOAD=$(jq -n \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg by "$MERGED_BY" \
            --arg sha "$SHA" \
            '{event_type: "playwright-automation-2-merged",
              client_payload: {pr_number: $pr, pr_title: $title, merged_by: $by, sha: $sha}}')

          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alhaj-ali/playwright-ui-automation/dispatches \
            -d "$PAYLOAD"